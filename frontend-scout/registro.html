<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro | Comunidad Scout</title>

    <link rel="stylesheet" href="estilos.css">
</head>

<a href="index.html" class="boton-volver">
    ← Volver al inicio
</a>
<body>

        <section id="registro" class="seccion-registro">

            <div class="contenedor-registro">

                <div class="registro-info">
                    <span class="simbolo-registro">⚜</span>

                    <h2>Únete a la Comunidad Scout</h2>

                    <p>
                        Crea tu cuenta para participar en actividades,
                        conocer grupos y acceder a contenidos de la comunidad.
                    </p>
                </div>

                <div class="registro-formulario">

                    <h3>Crear cuenta</h3>

                    <form id="form-registro">

                        <div class="campo-registro">
                            <label for="nombre-registro">Nombre completo</label>
                            <input
                                type="text"
                                id="nombre-registro"
                                placeholder="Ingresa tu nombre"
                                pattern="[A-Za-zÁÉÍÓÚáéíóúÑñÜü ]+"
                                title="El nombre solo puede contener letras y espacios"
                                required
                            >
                        </div>

                        <div class="campo-registro">
                            <label for="correo-registro">Correo electrónico</label>
                            <input
                                type="email"
                                id="correo-registro"
                                placeholder="correo@ejemplo.cl"
                                required
                            >
                        </div>

                        <div class="campo-registro">
                            <label for="password-registro">Contraseña</label>
                            <input
                                type="password"
                                id="password-registro"
                                placeholder="Crea una contraseña"
                                required
                            >
                        </div>

                        <div class="campo-registro">
                            <label for="confirmar-password">Confirmar contraseña</label>
                            <input
                                type="password"
                                id="confirmar-password"
                                placeholder="Repite tu contraseña"
                                required
                            >
                        </div>

                        <button type="submit" class="boton-registro">
                            Registrarme
                        </button>

                    </form>

                </div>

            </div>

        </section>

    <script src="registro.js"></script>

</body>

</html>
