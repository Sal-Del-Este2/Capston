<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi perfil  | Comunidad Scout</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="estilos.css">
</head>

<body class="pagina-panel">
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark navbar-scout">
            <div class="container">

                <a class="navbar-brand fw-bold" href="panel-usuario.html">
                    <span class="simbolo-logo">⚜</span>
                    Comunidad Scout
                </a>

                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#menuUsuario"
                    aria-controls="menuUsuario"
                    aria-expanded="false"
                    aria-label="Abrir menú"
                >
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div
                    class="collapse navbar-collapse"
                    id="menuUsuario"
                >
                    <div class="navbar-nav ms-auto">
                        <a class="nav-link" href="panel-usuario.html">
                            Mi cuenta
                        </a>

                        <a class="nav-link active" href="perfil-usuario.html">
                            Mi perfil
                        </a>

                        <a class="nav-link" href="index.html">
                            Ver sitio
                        </a>
                        <a href="mis-reclutas.html" class="boton-principal">Ver mis reclutas</a>

                        <a class="nav-link" href="#" id="cerrar-sesion">
                            Cerrar sesión
                        </a>
                    </div>
                </div>

            </div>
        </nav>
    </header>

    <main class="contenedor-perfil">

        <section class="encabezado-perfil">
            <div>
                <p class="subtitulo-panel">Mi cuenta</p>
                <h1>Datos personales</h1>

                <p>
                    Mantén actualizada tu información de contacto
                    y participación en la comunidad.
                </p>
            </div>

            <a href="panel-usuario.html" class="boton-volver-panel">
                ← Volver al panel
            </a>
        </section>

        <section class="tarjeta-formulario-perfil">

            <form id="form-perfil">

                <div class="grid-formulario-perfil">

                    <div class="campo-perfil">
                        <label for="nombre-perfil">
                            Nombre completo
                        </label>

                        <input
                            type="text"
                            id="nombre-perfil"
                            name="nombre"
                            placeholder="Ingresa tu nombre completo"
                            required
                        >
                    </div>

                    <div class="campo-perfil">
                        <label for="rut-perfil">
                            RUT
                        </label>

                        <input
                            type="text"
                            id="rut-perfil"
                            name="rut"
                            placeholder="12.345.678-9"
                            required
                        >
                    </div>

                    <div class="campo-perfil">
                        <label for="correo-perfil">
                            Correo electrónico
                        </label>

                        <input
                            type="email"
                            id="correo-perfil"
                            name="correo"
                            readonly
                        >
                    </div>

                    <div class="campo-perfil">
                        <label for="telefono-perfil">
                            Teléfono
                        </label>

                        <input
                            type="tel"
                            id="telefono-perfil"
                            name="telefono"
                            placeholder="+56 9 1234 5678"
                        >
                    </div>

                    <div class="campo-perfil">
                        <label for="fecha-nacimiento">
                            Fecha de nacimiento
                        </label>

                        <input
                            type="date"
                            id="fecha-nacimiento"
                            name="fechaNacimiento"
                        >
                    </div>

                    <div class="campo-perfil">
                        <label for="comuna-perfil">
                            Comuna
                        </label>

                        <input
                            type="text"
                            id="comuna-perfil"
                            name="comuna"
                            placeholder="Ejemplo: Peñalolén"
                        >
                    </div>

                    <div class="campo-perfil campo-completo">
                        <label for="direccion-perfil">
                            Dirección
                        </label>

                        <input
                            type="text"
                            id="direccion-perfil"
                            name="direccion"
                            placeholder="Ingresa tu dirección"
                        >
                    </div>

                    <div class="campo-perfil campo-completo">
                        <label for="grupo-perfil">
                            Grupo Scout
                        </label>

                        <select id="grupo-perfil" name="grupo">
                            <option value="">Selecciona un grupo</option>
                            <option value="Peñalolén">
                                Grupo Scout Peñalolén
                            </option>
                            <option value="La Reina">
                                Grupo Scout La Reina
                            </option>
                            <option value="Ñuñoa">
                                Grupo Scout Ñuñoa
                            </option>
                        </select>
                    </div>

                </div>

                <div class="acciones-perfil">
                    <a
                        href="panel-usuario.html"
                        class="boton-cancelar-perfil"
                    >
                        Cancelar
                    </a>

                    <button type="submit" class="boton-guardar-perfil">
                        Guardar cambios
                    </button>
                </div>

            </form>

        </section>

    </main>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>

    <script src="panel-usuario.js"></script>
    <script src="perfil-usuario.js"></script>



</body>
</html>
