<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar contraseña | Comunidad Scout</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <section class="seccion-login">
        <div class="contenedor-login">
            <div class="login-formulario">
                <h3>Cambiar contraseña</h3>
                <p>Por seguridad, debes establecer una contraseña personalizada antes de continuar.</p>
                <form id="form-cambiar-password">
                    <div class="campo-login">
                        <label for="password-temporal">Contraseña temporal</label>
                        <input type="password" id="password-temporal" placeholder="Ingresa la contraseña temporal" required>
                    </div>
                    <div class="campo-login">
                        <label for="password-nueva">Nueva contraseña</label>
                        <input type="password" id="password-nueva" placeholder="Ingresa tu nueva contraseña" required minlength="6">
                    </div>
                    <div class="campo-login">
                        <label for="password-confirmar">Confirmar nueva contraseña</label>
                        <input type="password" id="password-confirmar" placeholder="Repite tu nueva contraseña" required minlength="6">
                    </div>
                    <button type="submit" class="boton-login">Guardar contraseña</button>
                </form>
            </div>
        </div>
    </section>
    <script src="cambiar-password.js"></script>
</body>
</html>
