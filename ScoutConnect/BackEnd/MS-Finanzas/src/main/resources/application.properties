spring.config.import=optional:file:.env[.properties]
# POSTGRESQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO}
spring.jpa.show-sql=${DB_SHOW_SQL}
spring.jpa.properties.hibernate.format_sql=${DB_FORMAT_SQL}
#spring.datasource.driver-class-name=${DB_DRIVER}

# SERVER
server.port=${SERVER_PORT}

# TRANSBANK INTEGRACION
transbank.api.key.id=${TRANSBANK_KEY}
transbank.api.key.secret=${TRANSBANK_KEY_SECRET}
transbank.base.url=${TRANSBANK_URL}
transbank.return.url=${TRANSBANK_RETURN_URL}
mercadopago.access.token=${MERCADOPAGO_ACCESS_TOKEN}
# JWT
# jwt.secreto=${JWT_SECRETO}
# jwt.expiracion-minutos=${JWT_EXPIRACION_MINUTOS}