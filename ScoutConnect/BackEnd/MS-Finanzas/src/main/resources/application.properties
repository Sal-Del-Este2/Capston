spring.application.name=MS-Finanzas

spring.config.import=optional:file:.env[.properties]
server.port=${SERVER_PORT}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER}

spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO}
spring.jpa.show-sql=${DB_SHOW_SQL}
spring.jpa.properties.hibernate.dialect=${DB_DIALECT}
spring.jpa.properties.hibernate.format_sql=${DB_FORMAT_SQL}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB

app.storage.productos=${STORAGE_PRODUCTOS}

jwt.secreto=${JWT_SECRETO}
jwt.expiracion-minutos=${JWT_EXPIRACION_MINUTOS}

# Comunicación con MS-User
ms-user.base-url=${MS_USER_BASE_URL:http://localhost:8080}

transbank.environment=${TRANSBANK_ENV}
transbank.commerce-code=${TRANSBANK_COMMERCE_CODE}
transbank.api-key=${TRANSBANK_API_KEY}
transbank.return-url=${TRANSBANK_RETURN_URL}

management.endpoints.web.exposure.include=${EXPLOSURE_INCLUDE}
# SMTP
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000