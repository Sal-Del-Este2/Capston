spring.config.import=optional:file:.env[.properties]
# Nombre de la aplicación
spring.application.name=backend-scout

# Credenciales de prueba Mercado Pago (sandbox)
mercadopago.access.token=${MP_ACCESS_TOKEN}

# Conecta a la base de datos PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER}

# Configuración Hibernate / JPA
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO}
spring.jpa.show-sql=${DB_SHOW_SQL}
spring.jpa.properties.hibernate.dialect=${DB_DIALECT}
spring.jpa.properties.hibernate.format_sql=${DB_FORMAT_SQL}

# Límite para los mensajes
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# JWT
jwt.secreto=${JWT_SECRETO}
jwt.expiracion-minutos=${JWT_EXPIRACION_MINUTOS}