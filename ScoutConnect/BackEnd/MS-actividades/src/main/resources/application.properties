spring.config.import=optional:file:.env[.properties]

spring.application.name=microservicio-actividades
server.port=${SERVER_PORT}

# Conecta a la base de datos PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER}

# Configuración Hibernate / JPA
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO}
spring.jpa.show-sql=${DB_SHOW_SQL}
spring.jpa.properties.hibernate.format_sql=${DB_FORMAT_SQL}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=200MB
app.storage.eventos=${STORAGE_EVENTOS}
management.endpoints.web.exposure.include=${EXPLOSURE_INCLUDE}
# JWT
jwt.secreto=${JWT_SECRETO}
jwt.expiracion-minutos=${JWT_EXPIRACION_MINUTOS}
