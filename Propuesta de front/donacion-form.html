<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-scout">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <img class="logo-likankura" src="img/logo.png" alt="logo">Comunidad Scout
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="nosotros.html">información</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="eventos.html">Eventos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="noticias.html">Noticias</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="donacion.html">Donación</a>
                    </li>
                </ul>
                <a href="login.html" class="btn btn-login">Iniciar sesión</a>
            </div>
        </div>
    </nav>

    <!-- FORMULARIO -->
    <section class="donacion-form-section">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card border-0 shadow-lg donation-card">
                        <div class="card-header donation-header">
                            <h2 class="mb-0">Formulario de Donación</h2>
                        </div>
                        <div class="card-body p-5">
                            <form id="donacionForm">
                                <!-- MONTO -->
                                <div class="mb-4">
                                    <label class="form-label">Monto de Donación</label>
                                    <div class="input-group">
                                        <span class="input-group-text">$</span>
                                        <input type="number" class="form-control" min="1000" placeholder="10000" required>
                                    </div>
                                </div>
                                <!-- NOMBRE -->
                                <div class="mb-4">
                                    <label class="form-label">Nombre Completo</label>
                                    <input type="text" class="form-control"required>
                                </div>
                                <!-- EMAIL -->
                                <div class="mb-4">
                                    <label class="form-label">Correo Electrónico</label>
                                    <input type="email" class="form-control"required>
                                </div>
                                <!-- TELEFONO -->
                                <div class="mb-4">
                                    <label class="form-label">Teléfono</label>
                                    <input type="tel" class="form-control">
                                </div>
                                <!-- MENSAJE -->
                                <div class="mb-4">
                                    <label class="form-label">Mensaje (Opcional)</label>
                                    <textarea class="form-control" rows="4"></textarea>
                                </div>
                                <!-- METODO -->
                                <div class="mb-4">
                                    <label class="form-label">Método de Pago</label>
                                    <select class="form-select" required>
                                        <option value="">Seleccione</option>
                                        <option>Flow</option>
                                        <option>Transferencia Bancaria</option>
                                        <option>WebPay</option>
                                    </select>
                                </div>
                                <!-- TERMINOS -->
                                <div class="form-check mb-4">
                                    <input class="form-check-input" type="checkbox" id="acepto" required>
                                    <label class="form-check-label" for="acepto">Acepto los términos y condiciones.</label>
                                </div>
                                <!-- BOTONES -->
                                <div class="d-flex gap-3">
                                    <a href="donacion.html" class="btn btn-outline-secondary flex-fill">Volver</a>
                                    <button type="submit" class="btn btn-scout flex-fill">Continuar al Pago</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-4">
                    <img class="logo-likankura" src="img/logo.png" alt="">Comunidad Scout
                </div>
                <div class="col-md-5 text-center">
                    <a href="#" class="footer-link">Contacto</a>
                    <a href="#" class="footer-link">Preguntas frecuentes</a>
                    <a href="#" class="footer-link">Política de privacidad</a>
                </div>
                <div class="col-md-3 text-end">
                    <i class="fab fa-facebook fa-2x"></i>
                    <i class="fab fa-instagram fa-2x mx-3"></i>
                    <i class="fab fa-youtube fa-2x"></i>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
