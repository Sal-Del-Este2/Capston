<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-scout">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <img class="logo-likankura" src="img/logo.png" alt="logo">Comunidad Scout
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="nosotros.html">información</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="eventos.html">Eventos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="noticias.html">Noticias</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="donacion.html">Donación</a>
                    </li>
                </ul>
                <a href="login.html" class="btn btn-login">Iniciar sesión</a>
            </div>
        </div>
    </nav>

    <!-- LOGIN -->
    <main class="login-page">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-5 col-md-8">
                    <!-- LOGO -->
                    <div class="text-center mb-4">
                        <img src="img/logo.png" class="img-fluid logo-login" alt="Logo Scout">
                    </div>
                    <!-- FORMULARIO -->
                    <div class="card shadow-lg border-0 login-card">
                        <div class="card-body p-5">
                            <h2 class="text-center mb-4">Iniciar Sesión</h2>
                            <form action="#"
                                  method="POST">
                                <!-- Usuario -->
                                <div class="mb-4">
                                    <label class="form-label">Usuario</label>
                                    <div class="input-group">
                                        <span class="input-group-text">
                                            <i class="fa-solid fa-user"></i>
                                        </span>
                                        <input type="text" class="form-control" placeholder="Ejemplo: e.tigre" required>
                                    </div>
                                </div>
                                <!-- Contraseña -->
                                <div class="mb-4">
                                    <label class="form-label">Contraseña</label>
                                    <div class="input-group">
                                        <span class="input-group-text">
                                            <i class="fa-solid fa-lock"></i>
                                        </span>
                                        <input type="password" class="form-control" placeholder="Ejemplo: C0ntr4$3ñ@" required>
                                    </div>
                                </div>
                                <!-- Botón -->
                                <div class="d-grid">
                                    <button type="submit"class="btn btn-scout btn-lg">
                                        <a href="perfil-usuario.html">Entrar</a>
                                    </button>
                                </div>
                                <!-- Recuperar -->
                                <div class="text-center mt-4">
                                    <a href="#" class="recover-link">Recuperar contraseña</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-4">
                    <img class="logo-likankura" src="img/logo.png" alt="">Comunidad Scout
                </div>
                <div class="col-md-5 text-center">
                    <a href="#" class="footer-link">Contacto</a>
                    <a href="#" class="footer-link">Preguntas frecuentes</a>
                    <a href="#" class="footer-link">Política de privacidad</a>
                </div>
                <div class="col-md-3 text-end">
                    <i class="fab fa-facebook fa-2x"></i>
                    <i class="fab fa-instagram fa-2x mx-3"></i>
                    <i class="fab fa-youtube fa-2x"></i>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
