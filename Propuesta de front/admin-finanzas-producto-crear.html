<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrativo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="css/admin.css">
</head>

<body>
    <div class="admin-wrapper">
        <!-- HEADER -->
        <header class="admin-header">
            <div class="admin-logo">
                <img src="img/logo.png" alt="Logo">
                <h2>Panel administrativo</h2>
            </div>
            <div class="admin-header-center">
                <a class="btn btn-admin-logout" href="admin-dashboard.html">Dashboard</a>
            </div>
            <div class="admin-header-actions">
                <a href="#"><i class="fa-regular fa-user"></i></a>
                <a href="#"><i class="fa-regular fa-envelope"></i></a>
                <a href="login.html" class="btn btn-admin-logout">Salir</a>
            </div>
        </header>
        <!-- CONTENIDO -->
        <div class="admin-body">
            <!-- SIDEBAR -->
            <aside class="admin-sidebar">
                <nav>
                    <ul>
                        <li><a class="btn btn-admin" href="admin-informacion.html">Información</a></li>
                        <li><a class="btn btn-admin" href="admin-personal-adulto.html">Personal Adulto</a></li>
                        <li><a class="btn btn-admin" href="admin-personal-scout.html">Personal Scout</a></li>
                        <li><a class="btn btn-admin" href="admin-ubicaciones.html">Ubicaciones</a></li>
                        <li><a class="btn btn-admin" href="admin-noticias.html">Noticias</a></li>
                        <li><a class="btn btn-admin" href="admin-eventos.html">Eventos</a></li>
                        <li><a class="btn btn-admin" href="admin-finanzas.html">Finanzas</a></li>
                        <li><a class="btn btn-admin" href="admin-mensajes.html">Mensajes</a></li>
                        <li><a class="btn btn-admin" href="admin-contacto.html">Contacto</a></li>
                        <li><a class="btn btn-admin" href="admin-politicas.html">Política de Privacidad</a></li>
                    </ul>
                </nav>
            </aside>
            <!-- MAIN -->
            <main class="admin-content">
                <div class="admin-welcome">
                    <div class="admin-modal-card">
                        <div class="admin-form-header">
                            <h2>Nuevo Producto</h2>
                        </div>
                        <form>
                            <div class="row">
                                <div class="col-md-8">
                                    <div class="mb-3">
                                        <label class="form-label">
                                            Nombre del producto
                                        </label>
                                        <input type="text"
                                               class="form-control"
                                               placeholder="Pañoleta Scout">
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="mb-3">
                                        <label class="form-label">Categoría</label>
                                        <select class="form-select">
                                            <option>Uniforme</option>
                                            <option>Accesorio</option>
                                            <option>Campamento</option>
                                            <option>Otro</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Descripción</label>
                                <textarea class="form-control" rows="5" placeholder="Detalle del producto"></textarea>
                            </div>
                            <div class="row">
                                <div class="col-md-4">
                                    <div class="mb-3">
                                        <label class="form-label">Precio</label>
                                        <input type="number" class="form-control" min="0">
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="mb-3">
                                        <label class="form-label">Stock Inicial</label>
                                        <input type="number" class="form-control" min="0">
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="mb-3">
                                        <label class="form-label">Stock Mínimo</label>
                                        <input type="number" class="form-control" min="0">
                                    </div>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Imagen del Producto</label>
                                <input type="file" class="form-control" accept="image/*">
                            </div>
                            <div class="form-check mb-4">
                                <input class="form-check-input" type="checkbox" checked id="activo">
                                <label class="form-check-label" for="activo">Producto Activo</label>
                            </div>
                            <div class="text-center">
                                <button type="submit" class="btn btn-admin btn-lg">Guardar Producto</button>
                            </div>
                        </form>
                    </div>
                </div>
            </main>
        </div>
        <!-- FOOTER -->
        <footer class="admin-footer">
            <img src="img/logo.png" alt="Logo">
            <a href="#">Soporte</a>
            <a href="#">&copy; Copyrigh</a>
        </footer>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
